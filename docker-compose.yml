services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saints
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: deps
    working_dir: /app
    command: sh -c "npm install && npx prisma migrate deploy && npm run db:populate && npm run dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/saints?schema=public
      AUTH_SECRET: dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - hugo_content_source:/app/.content-source
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  hugo_content_source:
